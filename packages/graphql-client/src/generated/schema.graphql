type User {
  id: ID!
  email: String!
  name: String!
  lastName: String!
  avatar: String!
  password: String!
  isActive: Boolean!
}

type UserBoard {
  id: ID!
  email: String!
  name: String!
  lastName: String!
}

input createUserInput {
  email: String!
  lastName: String!
  name: String!
  password: String!
  avatar: String
}

input updateUserInput {
  id: ID!
  email: String
  lastName: String
  name: String
  password: String
  avatar: String
}

type Query {
  getUsers: [User!]!
  getUser(id: ID!): User
  getUserByEmail(email: String!): UserBoard
  getVideoGames: [VideoGame!]!
  getVideoGame(id: ID!): VideoGame
  getVideoGameByTitle(title: String!): VideoGame
}

type Mutation {
  createUser(input: createUserInput!): Boolean
  updateUser(input: updateUserInput!): Boolean
  deleteUser(id: ID!): Boolean
  createVideoGame(input: createVideoGameInput!): Boolean
  updateVideoGame(input: updateVideoGameInput!): Boolean
  deleteVideoGame(id: ID!): Boolean
}

type VideoGame {
  id: ID!
  title: String!
  description: String!
  genre: String!
  difficulty: String!
  state: String!
  isActive: Boolean!
}

input createVideoGameInput {
  title: String!
  description: String!
  genre: String!
  difficulty: String!
  state: String!
}

input updateVideoGameInput {
  id: ID!
  title: String
  description: String
  genre: String
  difficulty: String
  state: String
}